<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محول العملات اليمنية - MK Mokarem</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',Tahoma,Arial}
body{background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:12px}
.app{background:#fff;width:390px;border-radius:38px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.6);padding-bottom:18px}
.header{display:flex;align-items:center;gap:12px;padding:20px 18px}
.icon{width:56px;height:56px;background:linear-gradient(135deg,#FFD700,#FFA500);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;border:2px solid #d4a017}
.header h1{font-size:25px;color:#0e4a5f;font-weight:900}
.box-wrap{margin:12px;border:4px solid #d4a017;border-radius:28px;padding:16px;background:#fff;position:relative}
.box{background:#fff;border:2px solid #e5e5e5;border-radius:18px;padding:12px;box-shadow:inset 0 2px 6px rgba(0,0,0,.05)}
select{width:100%;padding:12px;border:1.6px solid #111;border-radius:30px;font-size:16px;font-weight:800;color:#0e4a5f;background:#fff;text-align:center}
input{width:100%;margin-top:10px;padding:14px;border:1.6px solid #111;border-radius:30px;font-size:22px;font-weight:800;color:#0e4a5f;text-align:center;outline:none}
input:focus{border-color:#d4a017}
.swap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border:2px solid #ccc;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.2);font-size:18px}
.yemen{text-align:center;margin-top:14px}
.footer{text-align:center;color:#0e4a5f;font-weight:800;letter-spacing:2px;margin-top:10px;font-size:14px}
.formula{background:#f0faf4;border:1px dashed #0a7a3d;margin-top:12px;border-radius:12px;padding:10px;font-size:11px;color:#0a7a3d;direction:ltr;text-align:center;word-break:break-all}
</style>
</head>
<body>
<div class="app">
<div class="header"><div class="icon">💱</div><h1>محول العملات اليمنية</h1></div>
<div class="box-wrap">
<div class="box">
<select id="source" onchange="convertFromSource()">
<option value="SAR">▼ ريال سعودي</option>
<option value="USD">▼ دولار أمريكي</option>
<option value="YAR_QADIM" selected>▼ ريال يمني قديم</option>
<option value="YAR_JADID">▼ ريال يمني جديد</option>
</select>
<input type="number" id="amount" value="1" oninput="convertFromSource()">
</div>
<div class="swap" onclick="swapAll()">↕️</div>
<div class="box" style="margin-top:18px">
<select id="target" onchange="convertFromSource()">
<option value="YAR_QADIM">▼ ريال يمني قديم</option>
<option value="YAR_JADID">▼ ريال يمني جديد</option>
<option value="SAR" selected>▼ ريال سعودي</option>
<option value="USD">▼ دولار أمريكي</option>
</select>
<input type="number" id="result" readonly>
</div>
<div class="formula" id="formula"></div>
</div>
<div class="yemen">
<svg viewBox="0 0 300 120" width="85%"><path d="M20 30 L250 15 L265 45 L230 85 L180 105 L90 115 L30 85 Z" fill="#CE1126"/><path d="M20 55 L265 45 L250 75 L30 85 Z" fill="white"/><path d="M30 85 L230 85 L180 105 L90 115 Z" fill="black"/><ellipse cx="275" cy="108" rx="10" ry="5" fill="black"/></svg>
</div>
<div class="footer">MK. mokarem saeed</div>
</div>
<script>
// نظريتك - The rate base USD
const rates = {
USD: 1.0,
SAR: 3.75,
YAR_QADIM: 524.0,
YAR_JADID: 1573.0,
};
function convertFromSource(){
let s = document.getElementById('source').value;
let t = document.getElementById('target').value;
let a = parseFloat(document.getElementById('amount').value)||0;
// ax = ((t/s)*a) y
let result = (rates[t] / rates[s]) * a;
document.getElementById('result').value = result.toFixed(4).replace(/\.?0+$/,'');
document.getElementById('formula').innerText = a + ' ' + s + ' = ((' + rates[t] + ' / ' + rates[s] + ') * ' + a + ') = ' + result.toFixed(4) + ' ' + t;
}
function swapAll(){
let s = document.getElementById('source');
let t = document.getElementById('target');
let tmp = s.value; s.value = t.value; t.value = tmp;
convertFromSource();
}
convertFromSource();
</script>
</body>
</html>
